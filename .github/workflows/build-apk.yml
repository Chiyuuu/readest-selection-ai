name: Build Readest AI Android APK

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream Readest ref (branch / tag / commit)'
        required: true
        default: 'main'
      abi:
        description: 'Target ABI'
        required: true
        default: 'aarch64'
        type: choice
        options: [aarch64, armv7, x86_64, universal]
      publish_release:
        description: 'Publish the APK as a GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NDK_VERSION: '28.2.13676358'
    steps:
      # This repository only holds the patch + build recipe. The full source
      # comes from upstream at build time, which keeps this repo tiny and
      # satisfies AGPL-3.0 (all derived source is public and reproducible).
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: .patch-repo

      - name: Checkout upstream Readest
        uses: actions/checkout@v4
        with:
          repository: readest/readest
          ref: ${{ inputs.upstream_ref }}
          path: readest
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: readest/pnpm-lock.yaml

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: readest/apps/readest-app/src-tauri -> target

      - name: Create env files for the Next.js build
        working-directory: readest
        run: |
          cat > apps/readest-app/.env.local <<'EOF'
          NEXT_PUBLIC_APP_PLATFORM=tauri
          NEXT_PUBLIC_POSTHOG_KEY=
          NEXT_PUBLIC_POSTHOG_HOST=
          NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
          SENTRY_DSN=
          SENTRY_AUTH_TOKEN=
          SENTRY_ORG=
          SENTRY_PROJECT=
          EOF
          : > apps/readest-app/.env.tauri

      - name: Install JavaScript dependencies
        working-directory: readest
        run: pnpm install --frozen-lockfile --prefer-offline

      # Tauri's android init rewrites tracked files; upstream CI restores them
      # with `git checkout .`. We MUST do that BEFORE applying our patch,
      # otherwise the restore would wipe the AI changes.
      - name: Initialize the Android project
        working-directory: readest/apps/readest-app
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png

      - name: Restore tracked files touched by tauri init
        working-directory: readest
        run: git checkout .

      - name: Apply the Selection-AI patch
        run: node .patch-repo/patch/apply.mjs readest

      - name: Verify patch landed
        working-directory: readest
        run: |
          grep -q "AIQueryPopup" apps/readest-app/src/app/reader/components/annotator/Annotator.tsx
          test -f apps/readest-app/src/services/ai/selectionQuery.ts
          test -f apps/readest-app/src/app/reader/components/annotator/AIQueryPopup.tsx
          echo "Patch verified."

      # A fresh, self-signed keystore: no secrets required, APK installs on
      # any device after enabling "install unknown apps". Keep this keystore
      # if you ever want to publish an update users can install over this one.
      - name: Create signing keystore
        working-directory: readest/apps/readest-app/src-tauri/gen/android
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/readest-ai.keystore" \
            -alias readest -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass readest-ai-key -keypass readest-ai-key \
            -dname "CN=Readest AI Personal Build, OU=Personal, O=Personal, L=Changsha, S=Hunan, C=CN"
          cat > keystore.properties <<EOF
          keyAlias=readest
          password=readest-ai-key
          storeFile=$RUNNER_TEMP/readest-ai.keystore
          EOF

      - name: Build signed APK
        working-directory: readest/apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          if [ "${{ inputs.abi }}" = "universal" ]; then
            pnpm tauri android build
          else
            pnpm tauri android build -t "${{ inputs.abi }}"
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             "$GITHUB_WORKSPACE/dist/ReadestAI-${{ inputs.abi }}.apk"
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadestAI-${{ inputs.abi }}-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Readest AI (${{ inputs.abi }}) — run ${{ github.run_number }}
          body: |
            Personal build of upstream Readest with the Selection-AI patch.

            - Select text in a book → **Ask AI** tool → ask / explain / AI translate /
              contextual dictionary / summarize, plus free-form follow-up questions.
            - Bring your own OpenAI-compatible endpoint (DeepSeek, OpenRouter,
              Ollama, self-hosted). Configure it in the popup's gear icon, or in
              Settings → AI. No official subscription or quota is touched.
            - Self-signed APK. Android will ask to allow installs from unknown sources.

            Built from `readest/readest@${{ inputs.upstream_ref }}`.
          files: dist/*.apk
